services:
  - type: web
    name: prompt-playground-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false          # Set this manually in the Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure key
      - key: DATABASE_URL
        sync: false          # Set this to your PostgreSQL URL in the Render dashboard
    autoDeploy: true

  - type: web
    name: prompt-playground-frontend
    runtime: static
    staticPublishPath: frontend
    buildCommand: ""         # No build step needed for vanilla HTML/JS/CSS
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
